# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you ch ange this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Ana Santasheva
email: ana dot santasheva at gmail dot com
author:
  name: Ana Santasheva
author_name: Ana Santasheva
description: >-
  Ana Santasheva builds research software and explores electricity systems,
  markets, and the physical craft of making things.
url: https://heyitsana.com # the base hostname & protocol for your site, e.g. http://example.com
lang: en

# permalink: /:slug.html

favicon: "/assets/img/favicon.svg"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme

# Build settings
markdown: kramdown
remote_theme: riggraz/no-style-please
theme_config:
  appearance: "auto" # can be "light", "dark" or "auto"
  back_home_text: "Back to home" # customize text for homepage link in post layout
  date_format: "%Y-%m-%d" # customize how date is formatted
  show_description: false # show blog description in home page
  gradient:
    - "#aef4ff"
    - "#3fbf8c"
    - "#ffd66b"

# Development and deployment files that should not be published.
exclude:
  - AGENTS.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - api
  - scripts
  - vercel.json
  - vendor
#   - vendor/ruby/

sass:
  style: compressed

# Navigation (used by nav.html)
nav:
  - title: Home
    url: /
  - title: Projects
    url: /projects/
  - title: Writing
    url: /writing/
  - title: Guestbook
    url: /guestbook/
  - title: Email
    url: /email/
