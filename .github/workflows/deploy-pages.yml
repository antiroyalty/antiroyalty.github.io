name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/queue-requirements.txt
      - name: Install queue workbook reader
        run: python -m pip install -r scripts/queue-requirements.txt
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Restore verified data from the grid-data branch
        env:
          GRID_STATE_DIR: ${{ runner.temp }}/grid-state
        run: |
          if git ls-remote --exit-code --heads origin grid-data > "$RUNNER_TEMP/grid-data-ref"; then
            git fetch --no-tags origin grid-data
            git worktree add --detach "$GRID_STATE_DIR" FETCH_HEAD
          else
            result=$?
            if [ "$result" -ne 2 ]; then exit "$result"; fi
            git worktree add --detach "$GRID_STATE_DIR" HEAD
            git -C "$GRID_STATE_DIR" switch --orphan grid-data
          fi
          node scripts/sync-grid-state.mjs restore "$GRID_STATE_DIR"
      - name: Refresh Electricity Desk snapshot
        id: refresh_electricity_desk
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/update-electricity-data.mjs
      - name: Refresh California market snapshot
        id: refresh_grid_market
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/update-grid-market-data.mjs
      - name: Report retained Electricity Desk snapshot
        if: always() && steps.refresh_electricity_desk.outcome == 'failure'
        run: echo "::warning title=Electricity Desk refresh failed::The previous snapshot was retained. Deployment will continue only if validation confirms it is usable."
      - name: Report retained California market snapshot
        if: always() && steps.refresh_grid_market.outcome == 'failure'
        run: echo "::warning title=California market refresh failed::The previous snapshot was retained. Deployment will continue only if validation confirms it is usable."
      - name: Check queue editions weekly
        id: refresh_queue
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/update-queue-data.py
      - name: Report retained queue edition
        if: always() && steps.refresh_queue.outcome == 'failure'
        run: echo "::warning title=Queue refresh failed::The previous queue observation was retained. Check source structure and source dates."
      - name: Validate data snapshots and pipelines
        run: |
          npm test
          python -m unittest discover -s scripts -p '*_test.py'
          npm run validate:data
      - name: Preserve verified intervals before building the site
        if: github.event_name != 'push'
        env:
          GRID_STATE_DIR: ${{ runner.temp }}/grid-state
        run: |
          node scripts/sync-grid-state.mjs persist "$GRID_STATE_DIR"
          git -C "$GRID_STATE_DIR" config user.name "github-actions[bot]"
          git -C "$GRID_STATE_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GRID_STATE_DIR" add electricity-desk.json grid-market.json history queue
          if ! git -C "$GRID_STATE_DIR" diff --cached --quiet; then
            git -C "$GRID_STATE_DIR" commit -m "update verified grid intervals"
            git -C "$GRID_STATE_DIR" push origin HEAD:refs/heads/grid-data
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build Jekyll site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
