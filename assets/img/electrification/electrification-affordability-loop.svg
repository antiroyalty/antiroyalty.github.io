<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">How electrification gets stuck</title>
  <desc id="desc">Needed grid investment can increase grid costs per kilowatt-hour. Higher grid costs lead to higher electricity rates, make electric vehicles and heat pumps less attractive, slow electrification and electricity sales, and spread fixed grid costs over fewer kilowatt-hours. That feeds back into higher grid costs per kilowatt-hour.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#a64f3c"/>
    </marker>
    <marker id="entry-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#486d8a"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#40271f" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="820" rx="24" fill="#fbf8f2"/>

  <text x="600" y="58" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="600" fill="#2d2926">How electrification gets stuck</text>
  <text x="600" y="91" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#6b625d">A self-reinforcing affordability loop</text>

  <rect x="48" y="133" width="286" height="92" rx="18" fill="#e7eef3" stroke="#6687a0" stroke-width="2.5"/>
  <text x="191" y="171" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#304b60">
    <tspan x="191">Needed grid</tspan>
    <tspan x="191" dy="30">investment</tspan>
  </text>

  <path d="M 334 179 C 373 179, 407 179, 446 179" fill="none" stroke="#486d8a" stroke-width="4" stroke-linecap="round" marker-end="url(#entry-arrow)"/>

  <path d="M 753 190 C 822 198, 866 236, 898 283" fill="none" stroke="#a64f3c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 980 370 C 980 411, 980 454, 980 500" fill="none" stroke="#a64f3c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 857 596 C 821 646, 784 680, 750 699" fill="none" stroke="#a64f3c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 450 699 C 410 680, 368 646, 338 596" fill="none" stroke="#a64f3c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 214 500 C 155 400, 215 286, 319 247 C 371 227, 420 218, 493 216" fill="none" stroke="#a64f3c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#soft-shadow)">
    <rect x="450" y="131" width="306" height="96" rx="18" fill="#f3ded8" stroke="#c66b55" stroke-width="2.5"/>
    <rect x="820" y="274" width="320" height="96" rx="18" fill="#f3ded8" stroke="#c66b55" stroke-width="2.5"/>
    <rect x="820" y="500" width="320" height="96" rx="18" fill="#f3ded8" stroke="#c66b55" stroke-width="2.5"/>
    <rect x="450" y="650" width="306" height="96" rx="18" fill="#f3ded8" stroke="#c66b55" stroke-width="2.5"/>
    <rect x="60" y="500" width="320" height="96" rx="18" fill="#f3ded8" stroke="#c66b55" stroke-width="2.5"/>
  </g>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="600" fill="#563126" text-anchor="middle">
    <text x="603" y="170">
      <tspan x="603">Grid costs per</tspan>
      <tspan x="603" dy="31">kWh rise</tspan>
    </text>
    <text x="980" y="313">
      <tspan x="980">Electricity</tspan>
      <tspan x="980" dy="31">rates rise</tspan>
    </text>
    <text x="980" y="537">
      <tspan x="980">EVs and heat pumps</tspan>
      <tspan x="980" dy="31">look less attractive</tspan>
    </text>
    <text x="603" y="687">
      <tspan x="603">Electrification and sales</tspan>
      <tspan x="603" dy="31">grow more slowly</tspan>
    </text>
    <text x="220" y="537">
      <tspan x="220">Fixed grid costs are spread</tspan>
      <tspan x="220" dy="31">over fewer new kWh</tspan>
    </text>
  </g>

  <circle cx="600" cy="434" r="128" fill="#fff4dd" stroke="#d3a252" stroke-width="3"/>
  <text x="600" y="422" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#6a4a19">Affordability</text>
  <text x="600" y="458" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#6a4a19">trap</text>
</svg>
