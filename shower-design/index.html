:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;dimensioned-shower&quot;&gt;

&lt;style&gt;

&lt;script type=&quot;module&quot;&gt;
  import * as THREE from &#x27;https://esm.sh/three@0.160.0&#x27;;
  import { OrbitControls } from &#x27;https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js&#x27;;

  const root = document.getElementById(&#x27;dimensioned-shower&#x27;);
  const stage = root.querySelector(&#x27;.shower-curb-stage&#x27;);
  const canvas = root.querySelector(&#x27;canvas&#x27;);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 700);
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.minDistance = 34;
  controls.maxDistance = 250;
  controls.maxPolarAngle = Math.PI * 0.495;

  scene.add(new THREE.HemisphereLight(0xfff8e9, 0x66706a, 2.35));
  const fill = new THREE.DirectionalLight(0xfff3df, 2.05);
  fill.position.set(-70, 115, -85);
  scene.add(fill);
  const wash = new THREE.DirectionalLight(0xdce9e2, 1.15);
  wash.position.set(80, 70, 30);
  scene.add(wash);

  const cypressBase = new THREE.Color(&#x27;#333728&#x27;);
  const rosatoBase = new THREE.Color(&#x27;#bda18f&#x27;);
  const groutGreen = new THREE.MeshStandardMaterial({ color: &#x27;#989889&#x27;, roughness: 0.94 });
  const groutRosato = new THREE.MeshStandardMaterial({ color: &#x27;#aaa198&#x27;, roughness: 0.95 });
  const chrome = new THREE.MeshStandardMaterial({ color: &#x27;#d6d8d5&#x27;, metalness: 0.9, roughness: 0.18 });
  const brushedStainless = new THREE.MeshStandardMaterial({ color: &#x27;#bfc4c3&#x27;, metalness: 0.88, roughness: 0.32 });
  const recessShadow = new THREE.MeshStandardMaterial({ color: &#x27;#171a16&#x27;, roughness: 1 });
  const substrate = new THREE.MeshStandardMaterial({ color: &#x27;#6f7169&#x27;, roughness: 1 });
  const roomFloorMat = new THREE.MeshStandardMaterial({ color: &#x27;#c4bba9&#x27;, roughness: 0.92 });

  function variationMaterials(base, count, roughness, metalness = 0) {
    const mats = [];
    for (let i = 0; i &lt; count; i += 1) {
      const color = base.clone();
      const light = ((i * 37) % 13 - 6) * 0.0014;
      const sat = ((i * 19) % 7 - 3) * 0.0015;
      color.offsetHSL(0, sat, light);
      mats.push(new THREE.MeshStandardMaterial({ color, roughness, metalness }));
    }
    return mats;
  }

  const greenMats = variationMaterials(cypressBase, 17, 0.46);
  const rosatoMats = variationMaterials(rosatoBase, 13, 0.72);
  let tileIndex = 0;

  function tileBox(width, height, depth, x, y, z, material, parent = scene) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
    mesh.position.set(x, y, z);
    parent.add(mesh);
    return mesh;
  }

  function greenMat() {
    const mat = greenMats[tileIndex % greenMats.length];
    tileIndex += 1;
    return mat;
  }

  function rosatoMat() {
    const mat = rosatoMats[tileIndex % rosatoMats.length];
    tileIndex += 1;
    return mat;
  }

  const shower = new THREE.Group();
  scene.add(shower);

  // Exterior bathroom floor.
  tileBox(96, 0.35, 66, 0, -0.25, -33, roomFloorMat, shower);

  // Schluter KERDI-LINE 90 cm channel with SOLID (A) brushed stainless steel
  // grate. The visible grate is 35-7/16 inches long, leaving approximately
  // 4-1/4 inches at each end of the 44-inch wall. A 2-inch tile strip remains
  // between the finished wall and the near edge of the drain.
  const drainSpec = {
    length: 35.4375,
    width: 2.91,
    wallGap: 2,
    centerZ: 22
  };
  drainSpec.xMax = 39 - drainSpec.wallGap;
  drainSpec.xMin = drainSpec.xMax - drainSpec.width;
  drainSpec.centerX = (drainSpec.xMin + drainSpec.xMax) / 2;
  drainSpec.zMin = drainSpec.centerZ - drainSpec.length / 2;
  drainSpec.zMax = drainSpec.centerZ + drainSpec.length / 2;

  function addFloorTilePiece(x1, z1, x2, z2, material) {
    const w = x2 - x1;
    const d = z2 - z1;
    if (w &lt;= 0.2 || d &lt;= 0.2) return;
    const centerX = x1 + w / 2;
    const behindDrain = x1 &gt;= drainSpec.xMax - 0.001;
    const slope = behindDrain ? 0.25 / 12 : 0;
    const tile = tileBox(
      w,
      0.15,
      d,
      centerX,
      0.12 + Math.max(0, centerX - drainSpec.xMax) * slope,
      z1 + d / 2,
      material,
      shower
    );
    if (behindDrain) tile.rotation.z = Math.atan(slope);
  }

  function addFloorTileAroundDrain(x1, z1, x2, z2, material) {
    const intersects = x2 &gt; drainSpec.xMin &amp;&amp; x1 &lt; drainSpec.xMax
      &amp;&amp; z2 &gt; drainSpec.zMin &amp;&amp; z1 &lt; drainSpec.zMax;
    if (!intersects) {
      addFloorTilePiece(x1, z1, x2, z2, material);
      return;
    }

    const middleLeft = Math.max(x1, drainSpec.xMin);
    const middleRight = Math.min(x2, drainSpec.xMax);
    if (x1 &lt; drainSpec.xMin) addFloorTilePiece(x1, z1, Math.min(x2, drainSpec.xMin), z2, material);
    if (x2 &gt; drainSpec.xMax) addFloorTilePiece(Math.max(x1, drainSpec.xMax), z1, x2, z2, material);
    if (z1 &lt; drainSpec.zMin) addFloorTilePiece(middleLeft, z1, middleRight, Math.min(z2, drainSpec.zMin), material);
    if (z2 &gt; drainSpec.zMax) addFloorTilePiece(middleLeft, Math.max(z1, drainSpec.zMax), middleRight, z2, material);
  }

  // Shower floor: 2 x 4 tile, straight-laid with the 4-inch direction running into the shower.
  tileBox(78.4, 0.18, 44.4, 0, -0.05, 22, groutGreen, shower);
  const floorPeriodX = 2.1875;
  const floorPeriodZ = 4.1875;
  for (let x = -38.9; x &lt; 39; x += floorPeriodX) {
    for (let z = 0.12; z &lt; 44; z += floorPeriodZ) {
      const w = Math.min(2, 39 - x);
      const d = Math.min(4, 44 - z);
      if (w &gt; 0.2 &amp;&amp; d &gt; 0.2) addFloorTileAroundDrain(x, z, x + w, z + d, greenMat());
    }
  }

  // Brushed stainless steel frame, dark drainage reveal, and solid center grate.
  tileBox(drainSpec.width, 0.08, drainSpec.length, drainSpec.centerX, 0.25, drainSpec.centerZ, brushedStainless, shower);
  tileBox(2.53, 0.05, drainSpec.length - 0.34, drainSpec.centerX, 0.31, drainSpec.centerZ, recessShadow, shower);
  tileBox(1.84, 0.08, drainSpec.length - 0.72, drainSpec.centerX, 0.36, drainSpec.centerZ, brushedStainless, shower);

  // Wall backing and Rosato grout planes. The back-wall layers are split around
  // the niche so the opening is genuinely recessed rather than surface-mounted.
  const nicheOpening = { left: -14.32, right: 14.32, bottom: 47.68, top: 62.32 };

  function backWallSurround(xMin, xMax, yMin, yMax, z, depth, material) {
    const leftWidth = nicheOpening.left - xMin;
    const rightWidth = xMax - nicheOpening.right;
    const centerWidth = nicheOpening.right - nicheOpening.left;
    const bottomHeight = nicheOpening.bottom - yMin;
    const topHeight = yMax - nicheOpening.top;
    tileBox(leftWidth, yMax - yMin, depth, xMin + leftWidth / 2, (yMin + yMax) / 2, z, material, shower);
    tileBox(rightWidth, yMax - yMin, depth, nicheOpening.right + rightWidth / 2, (yMin + yMax) / 2, z, material, shower);
    tileBox(centerWidth, bottomHeight, depth, 0, yMin + bottomHeight / 2, z, material, shower);
    tileBox(centerWidth, topHeight, depth, 0, nicheOpening.top + topHeight / 2, z, material, shower);
  }

  backWallSurround(-39.6, 39.6, 0, 132, 44.45, 0.65, substrate);
  tileBox(0.65, 132, 44.9, -39.45, 66, 22, substrate, shower);
  tileBox(0.65, 132, 44.9, 39.45, 66, 22, substrate, shower);
  backWallSurround(-39.1, 39.1, 8.4, 132, 43.92, 0.16, groutRosato);
  tileBox(0.16, 123.6, 44, -38.92, 70.2, 22, groutRosato, shower);
  tileBox(0.16, 123.6, 44, 38.92, 70.2, 22, groutRosato, shower);

  // Plain SensiTerre Rosato 12 x 24 wall tile, horizontal straight lay.
  function addBackWallTile(x1, y1, x2, y2, material) {
    const width = x2 - x1;
    const height = y2 - y1;
    if (width &gt; 0.2 &amp;&amp; height &gt; 0.2) {
      tileBox(width, height, 0.16, x1 + width / 2, y1 + height / 2, 43.78, material, shower);
    }
  }

  function addBackWallTileAroundNiche(x1, y1, x2, y2, material) {
    const intersects = x2 &gt; nicheOpening.left &amp;&amp; x1 &lt; nicheOpening.right
      &amp;&amp; y2 &gt; nicheOpening.bottom &amp;&amp; y1 &lt; nicheOpening.top;
    if (!intersects) {
      addBackWallTile(x1, y1, x2, y2, material);
      return;
    }

    const middleLeft = Math.max(x1, nicheOpening.left);
    const middleRight = Math.min(x2, nicheOpening.right);
    if (x1 &lt; nicheOpening.left) addBackWallTile(x1, y1, Math.min(x2, nicheOpening.left), y2, material);
    if (x2 &gt; nicheOpening.right) addBackWallTile(Math.max(x1, nicheOpening.right), y1, x2, y2, material);
    if (y1 &lt; nicheOpening.bottom) addBackWallTile(middleLeft, y1, middleRight, Math.min(y2, nicheOpening.bottom), material);
    if (y2 &gt; nicheOpening.top) addBackWallTile(middleLeft, Math.max(y1, nicheOpening.top), middleRight, y2, material);
  }

  const wallY0 = 8.25;
  for (let y = wallY0; y &lt; 132; y += 12.25) {
    for (let x = -38.85; x &lt; 39; x += 24.25) {
      const w = Math.min(24, 39 - x);
      const h = Math.min(12, 132 - y);
      if (w &gt; 0.5 &amp;&amp; h &gt; 0.5) addBackWallTileAroundNiche(x, y, x + w, y + h, rosatoMat());
    }
    for (const side of [-1, 1]) {
      for (let z = 0.1; z &lt; 44; z += 24.25) {
        const d = Math.min(24, 44 - z);
        const h = Math.min(12, 132 - y);
        if (d &gt; 0.5 &amp;&amp; h &gt; 0.5) tileBox(0.16, h, d, side * 38.78, y + h / 2, z + d / 2, rosatoMat(), shower);
      }
    }
  }

  // Eight-inch Cypress wall base, retaining the vertical 2 x 4 straight lay.
  tileBox(78.2, 8.2, 0.2, 0, 4.1, 43.7, groutGreen, shower);
  for (let x = -38.85; x &lt; 39; x += 2.1875) {
    for (let y = 0.05; y &lt; 8; y += 4.1875) {
      const w = Math.min(2, 39 - x);
      const h = Math.min(4, 8 - y);
      if (w &gt; 0.2 &amp;&amp; h &gt; 0.2) tileBox(w, h, 0.16, x + w / 2, y + h / 2, 43.56, greenMat(), shower);
    }
  }
  for (const side of [-1, 1]) {
    tileBox(0.2, 8.2, 44, side * 38.7, 4.1, 22, groutGreen, shower);
    for (let z = 0.05; z &lt; 44; z += 2.1875) {
      for (let y = 0.05; y &lt; 8; y += 4.1875) {
        const d = Math.min(2, 44 - z);
        const h = Math.min(4, 8 - y);
        if (d &gt; 0.2 &amp;&amp; h &gt; 0.2) tileBox(0.16, h, d, side * 38.56, y + h / 2, z + d / 2, greenMat(), shower);
      }
    }
  }

  // Custom-framed niche: the current design is 28 x 14 x 3-1/2 inches. The
  // finished wall face is z=43.70 and the niche back is z=47.20.
  const niche = new THREE.Group();
  shower.add(niche);
  tileBox(28.5, 14.5, 0.24, 0, 55, 47.52, recessShadow, niche);
  tileBox(28.2, 14.2, 0.16, 0, 55, 47.36, groutGreen, niche);
  for (let x = -13.65; x &lt; 13.7; x += 2.1875) {
    for (let y = 48.25; y &lt; 61.8; y += 4.1875) {
      const w = Math.min(2, 13.75 - x);
      const h = Math.min(4, 61.75 - y);
      if (w &gt; 0.2 &amp;&amp; h &gt; 0.2) tileBox(w, h, 0.15, x + w / 2, y + h / 2, 47.26, greenMat(), niche);
    }
  }

  // Grout beds for the four 3-1/2-inch-deep tiled returns.
  tileBox(28.2, 0.14, 3.5, 0, 47.92, 45.45, groutGreen, niche);
  tileBox(28.2, 0.14, 3.5, 0, 62.08, 45.45, groutGreen, niche);
  tileBox(0.14, 14, 3.5, -14.08, 55, 45.45, groutGreen, niche);
  tileBox(0.14, 14, 3.5, 14.08, 55, 45.45, groutGreen, niche);

  // Bottom and top returns: 2 x 4-inch Cypress tiles laid into the recess.
  for (let x = -13.9; x &lt; 14; x += 2.1875) {
    for (let z = 43.76; z &lt; 47.2; z += 4.1875) {

  const dimensionLabels = [

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );

      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),

            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,

      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);

  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {

    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }

  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {

    }

  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);

    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
